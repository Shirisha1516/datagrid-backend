kind: 'BuildConfig'
apiVersion: 'v1'
metadata:
  name: 'aip-crm-position-jdg'
  namespace: cicd
spec:
  source:
    git:
      ref: master
      uri: 'https://github.com/tmlconnected/AIP-CRM-POSITION-JDG1.git'
    sourceSecret:
      name: github-secret-ka  
  strategy:
    jenkinsPipelineStrategy:
      env:
      - name: PROJECT
        value: dev-esb
      jenkinsfilePath: 'Jenkinsfile'
